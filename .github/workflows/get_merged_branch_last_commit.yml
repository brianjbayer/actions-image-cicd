name: Merged Branch and Last Commit SHA of Branch

on:
  workflow_call:
    inputs:
      runner:
        description: "The type of runner for this workflow (Default: ubuntu-latest)"
        required: false
        type: string
        default: ubuntu-latest
      summary:
        description: Whether to provide a Github Step Summary
        required: false
        type: boolean
        default: false

    outputs:
      branch:
        description: The name of the merged branch (from merge comment)
        value: ${{ jobs.merged-branch-commit.outputs.branch }}
      commit:
        description: The last commit on the branch (commit before merge commit)
        value: ${{ jobs.merged-branch-commit.outputs.commit }}
      merge_commit:
        description: The commit SHA of the merged branch
        value: ${{ jobs.merged-branch-commit.outputs.merge_commit }}

jobs:
  merged-branch-commit:
    name: Determine Merged Branch and Last Commit on Branch
    runs-on: ${{ inputs.runner }}
    outputs:
      branch: ${{ steps.get-commits-from-log.outputs.branch }}
      commit: ${{ steps.get-commits-from-log.outputs.commit }}
      merge_commit: ${{ steps.get-commits-from-log.outputs.merge_commit }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Git log is source of truth
        run: git log

      - name: Get values from git log
        id: get-commits-from-log
        run: |
          # Merge commit
          merge_commit=$(git log -1 --pretty=%H)
          echo "merge_commit: [${merge_commit}]"
          echo "merge_commit=${merge_commit}" >> $GITHUB_OUTPUT

          # Last commit
          # The last commit of the merged branch is the merge commit's second parent
          if ! last_commit=$(git rev-parse --verify --quiet "${merge_commit}^2"); then
            message="❌ Expected ${merge_commit} to be a merge commit - It is NOT!"
            echo "${message}"
            echo "::error::${message}"
            echo "### ❌ Merged Branch and Last Commit SHA of Branch Failed" >> $GITHUB_STEP_SUMMARY
            echo "${message}" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "(last) commit: [${last_commit}]"
          echo "commit=${last_commit}" >> $GITHUB_OUTPUT

          # Branch
          branch=$(git log -1 --pretty=%B | grep 'Merge pull request' | sed 's/^[^/]*\///')
          echo "branch: [${branch}]"
          echo "branch=${branch}" >> $GITHUB_OUTPUT

      - name: Branch, last commit, and merge commit
        run: |
          echo "branch [${{steps.get-commits-from-log.outputs.branch}}]"
          echo "commit [${{ steps.get-commits-from-log.outputs.commit }}]"
          echo "merge_commit [${{ steps.get-commits-from-log.outputs.merge_commit }}]"

      - name: Summary report
        if: ${{ inputs.summary }}
        run: |
          echo "### Merged Branch and Last Commit SHA of Branch Failed" >> $GITHUB_STEP_SUMMARY
            echo "Merge Commit:  [\`${{ steps.get-commits-from-log.outputs.merge_commit }}\`]" >> $GITHUB_STEP_SUMMARY
            echo "(Last) Commit: [\`${{ steps.get-commits-from-log.outputs.commit }}\`]" >> $GITHUB_STEP_SUMMARY
            echo "Branch:        [\`${{steps.get-commits-from-log.outputs.branch}}\`]" >> $GITHUB_STEP_SUMMARY
