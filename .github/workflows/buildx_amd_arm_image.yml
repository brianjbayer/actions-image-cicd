name: Idempotent Buildx amd64/arm4 Multiplatform Image

on:
  workflow_call:

    secrets:
      registry_u:
        description: The username for the docker login
        required: true
      registry_p:
        description: The password (PAT) for the docker login
        required: true

    inputs:
      image:
        description: The name of the image to build and push
        required: true
        type: string
      buildopts:
        description: Optional docker buildx options e.g. --target
        type: string
      runner_general:
        description: "The type of runner for the general jobs in workflow (ubuntu-24.04-arm)"
        required: false
        type: string
        default: ubuntu-24.04-arm
      runner_amd64:
        description: "The type of linux/amd64 runner for this workflow (ubuntu-latest)"
        required: false
        type: string
        default: ubuntu-latest
      amd64_tag:
        description: "The amd64 architecture tag/name"
        required: false
        type: string
        default: amd64
      runner_arm64:
        description: "The type of linux/arm64 runner for this workflow (ubuntu-24.04-arm)"
        required: false
        type: string
        default: ubuntu-24.04-arm
      arm64_tag:
        description: "The arm64 architecture tag/name"
        required: false
        type: string
        default: arm64
      summary:
        description: "Add a summary report to the workflow run (true)"
        required: false
        type: boolean
        default: true
      # Registry build caches
      edge_build_cache_name:
        description: 'The name of the global "edge" build cache'
        required: false
        type: string
      root_build_cache_name:
        description: 'The name of the global "root" build cache'
        required: false
        type: string
      branch_build_cache_name:
        description: 'The name of the global "branch" build cache'
        required: false
        type: string

jobs:

  buildx-and-push-image:
    name: Build and Push Platform Image
    runs-on: ${{ matrix.platform.runner || inputs.runner_general }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: ${{ inputs.amd64_tag }}
            runner: ${{ inputs.runner_amd64 }}
          - name: ${{ inputs.arm64_tag }}
            runner: ${{ inputs.runner_arm64 }}
    steps:

      - name: Platform image name if build platform
        id: if-build-platform
        run: |
          if [ -z "${{ matrix.platform.runner }}" ]]; then
            echo "Skipping build of ${{ matrix.platform.name }} image"
          else
            platform_image_name="${{ inputs.image }}-${{ matrix.platform.name }}"
            echo "Building ${{ matrix.platform.name }} image [${platform_image_name}]"

            echo "platform_image=${platform_image_name}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        if: 'steps.if-build-platform.outputs.platform_image'

      - name: Image name
        if: 'steps.if-build-platform.outputs.platform_image'
        run: echo "Image name [${{ steps.if-build-platform.outputs.platform_image }}]"

      - name: Login to DockerHub registry
        if: 'steps.if-build-platform.outputs.platform_image'
        run: echo ${{ secrets.registry_p }} | docker login -u ${{ secrets.registry_u }} --password-stdin

      - name: Set up Docker buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        if: 'steps.if-build-platform.outputs.platform_image'

      - name: Buildx and push image
        if: 'steps.if-build-platform.outputs.platform_image'
        env:
          DOCKER_BUILDKIT: 1
          BUILDOPTS: ${{ inputs.buildopts }}
        run: |
          # Edge cache is both read and write
          if [ -n "${{ inputs.edge_build_cache_name }}" ] ; then
            edge_cache_name="${{ inputs.edge_build_cache_name }}-${{ matrix.platform.name }}"
            echo "Using Edge Cache: [${edge_cache_name}]"

            BUILDOPTS="${BUILDOPTS} --cache-from type=registry,ref=${edge_cache_name}"
            BUILDOPTS="${BUILDOPTS} --cache-to type=registry,ref=${edge_cache_name},mode=max"
          fi

          # Root cache is read only
          if [ -n "${{ inputs.root_build_cache_name }}" ] ; then
            root_cache_name="${{ inputs.root_build_cache_name }}-${{ matrix.platform.name }}"
            echo "Using Root Cache: [${root_cache_name}]"

            BUILDOPTS="${BUILDOPTS} --cache-from type=registry,ref=${root_cache_name}"
          fi

          # Branch cache is both read and write
          if [ -n "${{ inputs.branch_build_cache_name }}" ] ; then
            branch_cache_name="${{ inputs.branch_build_cache_name }}-${{ matrix.platform.name }}"
            echo "Using Branch Cache: [${branch_cache_name}]"

            BUILDOPTS="${BUILDOPTS} --cache-from type=registry,ref=${branch_cache_name}"
            BUILDOPTS="${BUILDOPTS} --cache-to type=registry,ref=${branch_cache_name},mode=max"
          fi
          echo "Build options..."
          echo ["${BUILDOPTS}"]

          docker pull ${{ inputs.image }}-${{ matrix.platform.name }} \
          || docker buildx build \
            ${BUILDOPTS} \
            --push --platform linux/${{ matrix.platform.name }} \
            --tag ${{ inputs.image }}-${{ matrix.platform.name }} \
            .

      - name: Logout of DockerHub registry
        if: 'steps.if-build-platform.outputs.platform_image'
        run: docker logout


      - name: Platform build summary
        if: 'steps.if-build-platform.outputs.platform_image'
        run: |
          image_fragment="<code>${{ steps.if-build-platform.outputs.platform_image }}</code>"
          summary="<b>Built and Pushed <code>${{ matrix.platform.name }}</code> Image:</b><br>${image_fragment}"
          echo "${summary}" >> $GITHUB_STEP_SUMMARY

  combine-images:
    name: Create Multiplatform Image
    runs-on: ${{ inputs.runner_general }}
    needs: buildx-and-push-image
    env:
      IMAGE: ${{ inputs.image }}

    steps:

      - name: There must be a platform
        run: |
         if [ -z "${{ inputs.runner_amd64 }}" ] && [ -z "${{ inputs.runner_arm64 }}" ]; then
           echo "::error::At least must platform must be built - no platform runner specified"
           exit 1
         fi

      - name: Login to DockerHub registry
        run: echo ${{ secrets.registry_p }} | docker login -u ${{ secrets.registry_u }} --password-stdin

      - name: Set up Docker buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Create and push multiplatform image
        run: |
          IMAGES=''
          [ -n "${{ inputs.runner_amd64 }}" ] && IMAGES="${IMAGES} ${{ inputs.image }}-${{ inputs.amd64_tag }}"
          [ -n "${{ inputs.runner_arm64 }}" ] && IMAGES="${IMAGES} ${{ inputs.image }}-${{ inputs.arm64_tag }}"
          docker pull ${IMAGE} || docker buildx imagetools create -t ${IMAGE} ${IMAGES}

      - name: Logout of DockerHub registry
        run: docker logout

      - name: Annotate image name
        run: echo "::notice::Built and pushed multiplatform image [${IMAGE}]"

      - name: Summary report
        if: ${{ inputs.summary }}
        run: |
          cat <<EOF >> $GITHUB_STEP_SUMMARY
          ### Multiplatform Image Built and Pushed
          \`${IMAGE}\`
          EOF
